name: Build & Release

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    tags:
      - 'v*' # Trigger automatically when a version tag like v1.0.0 is pushed

jobs:
  release:
    permissions:
      contents: write # Required for tauri-action to create a GitHub release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Frontend Dependencies
        working-directory: ./ui
        run: npm install

      - name: Build Tauri App & Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./ui
          tagName: v__VERSION__
          releaseName: 'AltShift v__VERSION__'
          releaseBody: 'AltShift - Offline Privacy Keyboard Switcher. See the assets below to download and install.'
          releaseDraft: true
          prerelease: false
