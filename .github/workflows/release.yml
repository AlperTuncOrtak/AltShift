name: Build & Release

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    tags:
      - 'v*' # Trigger automatically when a version tag like v1.0.0 is pushed

jobs:
  release:
    permissions:
      contents: write # Required for tauri-action to create a GitHub release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # The desktop backends embed their language models with include_str!, so
      # the lists must exist before cargo runs. Without this the release build
      # fails on a missing data/en.txt -- CI has this step, release did not.
      - name: Fetch Wordlists
        shell: bash
        run: ./fetch-wordlists.sh

      - name: Install Frontend Dependencies
        working-directory: ./ui
        run: npm install

      - name: Build Tauri App & Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./ui
          # __VERSION__ is read from ui/src-tauri/tauri.conf.json, NOT from the
          # git tag. Pushing a v0.1.1 tag without bumping that file publishes
          # the new build under the old version -- which is how v0.1.1's
          # installer ended up inside the v0.1.0 draft, labelled 0.1.0.
          tagName: v__VERSION__
          releaseName: 'AltShift v__VERSION__'
          releaseBody: 'AltShift - Offline Privacy Keyboard Switcher. See the assets below to download and install.'
          releaseDraft: true
          prerelease: false
